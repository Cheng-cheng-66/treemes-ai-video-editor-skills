schema_version: 1
preset_id: factory_demo_hybrid_sync_v1
locked: true

zones:
  A_SYNC_LOCKED:
    definition: speaking_mouth_clearly_visible
    picture_and_dialogue_must_share_timeline: true
    independent_audio_compression: forbidden
    maximum_sync_offset_frames: 1
    confidence_minimum_for_automatic_assignment: 0.92

  B_SYNC_FLEX:
    definition: speaker_distant_side_partial_or_mouth_unclear
    limited_dialogue_compression_allowed: true
    maximum_unanchored_duration_seconds: 4.0
    next_A_SYNC_LOCKED_anchor_required: true
    confidence_minimum_for_automatic_assignment: 0.88

  C_AUDIO_FREE:
    definition: tablet_board_equipment_line_or_hand_view_without_visible_mouth
    dialogue_may_be_edited_as_voice_over: true
    picture_must_prefer_one_continuous_take: true
    picture_cut_at_each_dialogue_pause: forbidden
    dialogue_pause_compression_independent_of_picture: true
    continuous_ambience_required: true
    return_to_A_sync_anchor_required: true
    experiment_minimum_pause_count: 2
    experiment_minimum_each_pause_seconds: 0.5
    confidence_minimum_for_automatic_assignment: 0.94

  D_ACTION_LOCKED:
    definition: click_swipe_page_change_or_equipment_operation
    preserve_complete_action: true
    cut_inside_action: forbidden
    action_start_and_end_frames_required: true
    dialogue_may_continue_as_voice_over: true
    confidence_minimum_for_automatic_assignment: 0.95

audio_edits:
  dialogue_crossfade_ms:
    minimum: 20
    default: 40
    maximum: 60
  ambience:
    continuous_bed_required: true
    abrupt_noise_floor_change_forbidden: true
  return_to_visible_speaker:
    sync_anchor_required: true
    maximum_offset_frames: 1
